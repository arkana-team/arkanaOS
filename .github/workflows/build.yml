name: Build arkanaOS ISO Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      skip_stage1:
        description: 'Skip Stage 1 (Download latest arkana-stage1 artifact instead)'
        type: boolean
        default: false
      skip_stage2:
        description: 'Skip Stage 2 (Download latest arkana-stage2 artifact instead)'
        type: boolean
        default: false
      skip_stage3:
        description: 'Skip Stage 3 (Download latest arkana-stage3 artifact instead)'
        type: boolean
        default: false

# Cancel redundant build runs if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # STAGE 1: Base System
  # ==========================================
  base:
    name: 1. Build Base System
    if: ${{ github.event_name == 'push' || !inputs.skip_stage1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Frees 35+ GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache
          sudo docker image prune --all --force || true

      - name: Setup & Persist Ccache Across Runs
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-ccache-
          max-size: 10G

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: arkana-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Base Stage
        run: |
          mkdir -p src staging output
          docker run --rm \
            -v "$(pwd)/src:/build/arkana/src" \
            -v "$(pwd)/staging:/build/arkana/staging" \
            -v "$(pwd)/output:/build/arkana/output" \
            -v "$HOME/.cache/ccache:/home/builder/.cache/ccache" \
            -e CCACHE_DIR=/home/builder/.cache/ccache \
            arkana-builder bash -c "sudo make -f arkanas/01_base.mk"

      - name: Archive Stage 1
        run: sudo tar -cf arkana-stage1.tar staging src && sudo chown $USER:$USER arkana-stage1.tar

      - name: Upload Stage 1 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkana-stage1
          path: arkana-stage1.tar
          retention-days: 7

      - name: Upload Error Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-error-logs
          path: |
            src/*/build/meson-logs/
            src/*/config.log
            src/*/build/CMakeOutput.log
            src/*/build/CMakeError.log
          retention-days: 7

  # ==========================================
  # STAGE 2: Extensions & Toolchain
  # ==========================================
  toolchain:
    name: 2. Build Extensions & Toolchain
    needs: base
    if: |
      always() && 
      (needs.base.result == 'success' || needs.base.result == 'skipped') &&
      (github.event_name == 'push' || !inputs.skip_stage2)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache
          sudo docker image prune --all --force || true

      - name: Setup & Persist Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-ccache-
          max-size: 10G

      - name: Download Stage 1 Artifact (From Current Run)
        if: needs.base.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: arkana-stage1

      - name: Download Stage 1 Artifact (From Latest Successful Run)
        if: needs.base.result == 'skipped'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: build.yml
          branch: main
          name: arkana-stage1
          search_artifacts: true

      - name: Unarchive Stage 1
        run: sudo tar -xf arkana-stage1.tar && rm arkana-stage1.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: arkana-builder:latest
          cache-from: type=gha

      - name: Build Extensions & Toolchain Stage
        run: |
          docker run --rm \
            -v "$(pwd)/src:/build/arkana/src" \
            -v "$(pwd)/staging:/build/arkana/staging" \
            -v "$(pwd)/output:/build/arkana/output" \
            -v "$HOME/.cache/ccache:/home/builder/.cache/ccache" \
            -e CCACHE_DIR=/home/builder/.cache/ccache \
            arkana-builder bash -c "sudo make -f arkanas/02_ext.mk && sudo make -f arkanas/03_arkpkg.mk && sudo make -f arkanas/04_toolchain.mk"

      - name: Archive Stage 2
        run: sudo tar -cf arkana-stage2.tar staging src && sudo chown $USER:$USER arkana-stage2.tar

      - name: Upload Stage 2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkana-stage2
          path: arkana-stage2.tar
          retention-days: 7

      - name: Upload Error Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-error-logs
          path: |
            src/*/build/meson-logs/
            src/*/config.log
            src/*/build/CMakeOutput.log
            src/*/build/CMakeError.log
          retention-days: 7

  # ==========================================
  # STAGE 3: Graphics
  # ==========================================
  graphics:
    name: 3. Build Graphics Stack
    needs: toolchain
    if: |
      always() && 
      (needs.toolchain.result == 'success' || needs.toolchain.result == 'skipped') &&
      (github.event_name == 'push' || !inputs.skip_stage3)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache
          sudo docker image prune --all --force || true

      - name: Setup & Persist Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-ccache-
          max-size: 10G

      - name: Download Stage 2 Artifact (From Current Run)
        if: needs.toolchain.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: arkana-stage2

      - name: Download Stage 2 Artifact (From Latest Successful Run)
        if: needs.toolchain.result == 'skipped'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: build.yml
          branch: main
          name: arkana-stage2
          search_artifacts: true

      - name: Unarchive Stage 2
        run: sudo tar -xf arkana-stage2.tar && rm arkana-stage2.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: arkana-builder:latest
          cache-from: type=gha

      - name: Build Graphics Stage
        run: |
          docker run --rm \
            -v "$(pwd)/src:/build/arkana/src" \
            -v "$(pwd)/staging:/build/arkana/staging" \
            -v "$(pwd)/output:/build/arkana/output" \
            -v "$HOME/.cache/ccache:/home/builder/.cache/ccache" \
            -e CCACHE_DIR=/home/builder/.cache/ccache \
            arkana-builder bash -c "sudo make -f arkanas/05_graphics.mk && sudo make -f arkanas/06_graphics_ext.mk"

      - name: Archive Stage 3
        run: sudo tar -cf arkana-stage3.tar staging src && sudo chown $USER:$USER arkana-stage3.tar

      - name: Upload Stage 3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkana-stage3
          path: arkana-stage3.tar
          retention-days: 7

      - name: Upload Error Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-error-logs
          path: |
            src/*/build/meson-logs/
            src/*/config.log
            src/*/build/CMakeOutput.log
            src/*/build/CMakeError.log
          retention-days: 7

  # ==========================================
  # STAGE 4: ISO Generation
  # ==========================================
  iso:
    name: 4. Assemble Bootable ISO
    needs: graphics
    if: always() && (needs.graphics.result == 'success' || needs.graphics.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache
          sudo docker image prune --all --force || true

      - name: Setup & Persist Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-ccache-
          max-size: 10G

      - name: Download Stage 3 Artifact (From Current Run)
        if: needs.graphics.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: arkana-stage3

      - name: Download Stage 3 Artifact (From Latest Successful Run)
        if: needs.graphics.result == 'skipped'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: build.yml
          branch: main
          name: arkana-stage3
          search_artifacts: true

      - name: Unarchive Stage 3
        run: sudo tar -xf arkana-stage3.tar && rm arkana-stage3.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: arkana-builder:latest
          cache-from: type=gha

      - name: Build ISO Stage
        run: |
          mkdir -p output
          docker run --rm \
            -v "$(pwd)/src:/build/arkana/src" \
            -v "$(pwd)/staging:/build/arkana/staging" \
            -v "$(pwd)/output:/build/arkana/output" \
            -v "$HOME/.cache/ccache:/home/builder/.cache/ccache" \
            -e CCACHE_DIR=/home/builder/.cache/ccache \
            arkana-builder bash -c "sudo make -f arkanas/07_iso.mk"

      - name: Upload Final arkanaOS ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkanaOS-nightly-iso
          path: output/arkana.iso
          if-no-files-found: error
          retention-days: 14

      - name: Generate Release Notes & Tags from Template
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          BUILD_NUM=$(cat .buildnum 2>/dev/null || echo "143")
          sed -i "s/BUILD_DATE/$BUILD_DATE/g" RELEASE_TEMPLATE.md
          sed -i "s/BUILD_NUM/$BUILD_NUM/g" RELEASE_TEMPLATE.md
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: nightly-${{ env.BUILD_DATE }}-build-${{ env.BUILD_NUM }}
          name: arkanaOS Nightly Build (${{ env.BUILD_DATE }})
          body_path: RELEASE_TEMPLATE.md
          files: output/arkana.iso
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
