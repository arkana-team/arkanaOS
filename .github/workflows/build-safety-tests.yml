name: Build safety tests

on:
  push:
    paths:
      - Makefile
      - Dockerfile
      - build.sh
      - 'arkanas/**/*.mk'
      - scripts/detect-container.sh
      - tests/test_build_safety.py
      - .github/workflows/build-safety-tests.yml
  pull_request:
    paths:
      - Makefile
      - Dockerfile
      - build.sh
      - 'arkanas/**/*.mk'
      - scripts/detect-container.sh
      - tests/test_build_safety.py
      - .github/workflows/build-safety-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out arkanaOS
        uses: actions/checkout@v4
      - name: Test build safety guards and job limits
        run: python3 -m unittest discover -s tests -p 'test_build_safety.py'
