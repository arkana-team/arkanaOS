name: Release metadata tests

on:
  pull_request:
    paths:
      - "arkanas/01_base.mk"
      - ".github/workflows/00_run_all.yml"
      - ".github/workflows/04_stage4_iso.yml"
      - "RELEASE_TEMPLATE.md"
      - "tests/test_release_metadata.py"
      - "scripts/select-weekly-update-base.py"
      - "scripts/verify-weekly-base-provenance.py"
      - "tests/test_weekly_base_provenance.py"
      - ".github/workflows/release-metadata-tests.yml"
  push:
    paths:
      - "arkanas/01_base.mk"
      - ".github/workflows/00_run_all.yml"
      - ".github/workflows/04_stage4_iso.yml"
      - "RELEASE_TEMPLATE.md"
      - "tests/test_release_metadata.py"
      - "scripts/select-weekly-update-base.py"
      - "scripts/verify-weekly-base-provenance.py"
      - "tests/test_weekly_base_provenance.py"
      - ".github/workflows/release-metadata-tests.yml"

permissions:
  contents: read

jobs:
  release-metadata:
    name: Check release labels and build-number safety
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run release metadata tests
        run: python3 -m unittest discover -s tests -p 'test_release_metadata.py' -v
      - name: Run weekly base provenance tests
        run: python3 -m unittest discover -s tests -p 'test_weekly_base_provenance.py' -v
