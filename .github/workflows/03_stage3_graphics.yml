name: 3. Build Graphics Stack

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  graphics:
    name: 3. Build Graphics Stack
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache
          sudo docker image prune --all --force || true

      - name: Setup & Persist Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-stage3
          restore-keys: ${{ runner.os }}-ccache-
          max-size: 10G

      - name: Download Stage 2 Artifact (From chained Run All)
        if: github.workflow == 'Run All Pipeline Stages'
        uses: actions/download-artifact@v4
        with:
          name: arkana-stage2

      - name: Download Stage 2 Artifact (Latest Across Repo)
        if: github.workflow != 'Run All Pipeline Stages'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching artifacts list..."
          if ! ARTIFACT_JSON=$(gh api repos/${{ github.repository }}/actions/artifacts --per-page 100); then
            echo "Error: Failed to fetch artifacts list from GitHub API. Please check token permissions."
            exit 1
          fi
          
          # Find latest matching artifact
          ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | jq -r '.artifacts | map(select((.name == "arkana-stage2" or .name == "arkana-toolchain-staging") and .expired == false)) | sort_by(.created_at) | last | .id')
          
          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "Error: No valid stage 2 artifact found in the repository!"
            echo "API Response content:"
            echo "$ARTIFACT_JSON" | head -n 30
            exit 1
          fi
          
          echo "Found latest Stage 2 Artifact ID: $ARTIFACT_ID"
          echo "Downloading..."
          if ! gh api repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > artifact.zip; then
            echo "Error: Failed to download artifact from GitHub API."
            exit 1
          fi
          
          echo "Unzipping..."
          unzip -q artifact.zip
          rm artifact.zip
          
          if [ -f arkana-toolchain-staging.tar ]; then
            mv arkana-toolchain-staging.tar arkana-stage2.tar
          fi
          
          if [ ! -f arkana-stage2.tar ]; then
            echo "Error: Extracted archive did not contain arkana-stage2.tar or arkana-toolchain-staging.tar!"
            exit 1
          fi
          
          echo "Successfully prepared Stage 2 artifact!"

      - name: Unarchive Stage 2
        run: sudo tar -xf arkana-stage2.tar && rm arkana-stage2.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: arkana-builder:latest
          cache-from: type=gha

      - name: Build Graphics Stage
        run: |
          docker run --rm \
            -v "$(pwd)/src:/build/arkana/src" \
            -v "$(pwd)/staging:/build/arkana/staging" \
            -v "$(pwd)/output:/build/arkana/output" \
            -v "$HOME/.cache/ccache:/home/builder/.cache/ccache" \
            -e CCACHE_DIR=/home/builder/.cache/ccache \
            arkana-builder bash -c "sudo make -f arkanas/05_graphics.mk && sudo make -f arkanas/06_graphics_ext.mk"

      - name: Archive Stage 3
        run: sudo tar -cf arkana-stage3.tar staging src && sudo chown $USER:$USER arkana-stage3.tar

      - name: Upload Stage 3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkana-stage3
          path: arkana-stage3.tar
          retention-days: 7

      - name: Upload Error Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-error-logs
          path: |
            src/*/build/meson-logs/
            src/*/config.log
            src/*/build/CMakeOutput.log
            src/*/build/CMakeError.log
          retention-days: 7
