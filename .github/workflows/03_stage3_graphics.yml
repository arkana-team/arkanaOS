name: 3. Build Graphics Stack

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Run All run ID on the default branch to rebuild"
        required: true
        type: string
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  graphics:
    name: 3. Build Graphics Stack
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Verify Stage 2 Source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Intermediate builds require a manual run on the default branch." >&2
            exit 1
          fi
          if [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/00_run_all.yml@$GITHUB_REF" ]]; then
            # Run All orders stage3 after stage2; download only from this run.
            SOURCE_RUN_ID=$GITHUB_RUN_ID
            SOURCE_SHA=$GITHUB_SHA
          elif [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/03_stage3_graphics.yml@$GITHUB_REF" ]]; then
            if ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "Provide a successful Run All run ID." >&2
              exit 1
            fi
            # Run All keeps every upstream producing stage within one trusted run.
            WORKFLOW_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/00_run_all.yml" --jq .id)
            RUN_JSON=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
            SOURCE_SHA=$(jq -er --arg run_id "$SOURCE_RUN_ID" --arg workflow_id "$WORKFLOW_ID" \
              --arg repository "$GITHUB_REPOSITORY" --arg branch "$DEFAULT_BRANCH" '
              select((.id | tostring) == $run_id and
                (.workflow_id | tostring) == $workflow_id and
                .repository.full_name == $repository and
                .head_repository.full_name == $repository and
                .event == "workflow_dispatch" and .head_branch == $branch and
                .status == "completed" and .conclusion == "success") |
              .head_sha | select(test("^[0-9a-f]{40}$"))' <<< "$RUN_JSON")
          else
            echo "Unsupported intermediate workflow caller." >&2
            exit 1
          fi
          {
            echo "run_id=$SOURCE_RUN_ID"
            echo "sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache
          sudo docker image prune --all --force || true

      - name: Setup & Persist Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-stage3
          restore-keys: ${{ runner.os }}-ccache-
          max-size: 10G

      - name: Download Verified Stage 2 Artifact
        uses: actions/download-artifact@v4
        with:
          name: arkana-stage2
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/stage2-download

      - name: Unarchive Stage 2
        run: |
          set -euo pipefail
          EXTRACT_DIR=$(mktemp -d "$RUNNER_TEMP/stage2.XXXXXX")
          trap 'sudo rm -rf "$EXTRACT_DIR"' EXIT
          sudo tar -xf "$RUNNER_TEMP/stage2-download/arkana-stage2.tar" -C "$EXTRACT_DIR" -- staging src
          for member in staging src; do
            if [[ ! -d "$EXTRACT_DIR/$member" || -L "$EXTRACT_DIR/$member" || -e "$member" || -L "$member" ]]; then
              echo "Invalid or conflicting Stage 2 directory: $member" >&2
              exit 1
            fi
          done
          sudo mv "$EXTRACT_DIR/staging" "$EXTRACT_DIR/src" .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: arkana-builder:latest
          cache-from: type=gha

      - name: Build Graphics Stage
        run: |
          docker run --rm \
            -v "$(pwd)/src:/build/arkana/src" \
            -v "$(pwd)/staging:/build/arkana/staging" \
            -v "$(pwd)/output:/build/arkana/output" \
            -v "$HOME/.cache/ccache:/home/builder/.cache/ccache" \
            -e CCACHE_DIR=/home/builder/.cache/ccache \
            arkana-builder bash -c "sudo --preserve-env make -f arkanas/05_graphics.mk && sudo --preserve-env make -f arkanas/06_graphics_ext.mk"

      - name: Archive Stage 3
        run: sudo tar -cf arkana-stage3.tar staging src && sudo chown $USER:$USER arkana-stage3.tar

      - name: Upload Stage 3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkana-stage3
          path: arkana-stage3.tar
          retention-days: 7

      - name: Make Build Logs Readable on Failure
        if: failure()
        run: |
          if [ -d src ]; then
            sudo find src -type d -exec chmod a+rx {} +
            sudo find src -type f \
              \( -path '*/build/meson-logs/*' -o -path '*/config.log' \
              -o -path '*/build/CMakeOutput.log' -o -path '*/build/CMakeError.log' \
              -o -path '*/build/CMakeFiles/CMakeConfigureLog.yaml' \) \
              -exec chmod a+r {} +
          fi

      - name: Upload Error Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-error-logs
          path: |
            src/*/build/meson-logs/
            src/*/config.log
            src/*/build/CMakeOutput.log
            src/*/build/CMakeError.log
            src/*/build/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 7
