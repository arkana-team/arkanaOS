name: Run All Pipeline Stages

on:
  workflow_dispatch:
    inputs:
      release_prefix:
        description: "Release label before the automatic build number (nightly, r1-a1, r1-b1, r1-1)"
        required: true
        default: nightly
        type: string

concurrency:
  group: run-all-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  stage1:
    uses: ./.github/workflows/01_stage1_base.yml
    with:
      release_prefix: ${{ inputs.release_prefix }}
    secrets: inherit

  stage2:
    needs: stage1
    uses: ./.github/workflows/02_stage2_toolchain.yml
    secrets: inherit

  stage3:
    needs: stage2
    uses: ./.github/workflows/03_stage3_graphics.yml
    secrets: inherit

  stage4:
    needs: stage3
    uses: ./.github/workflows/04_stage4_iso.yml
    secrets: inherit
