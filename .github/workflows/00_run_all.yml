name: Run All Pipeline Stages

on:
  workflow_dispatch:
    inputs:
      release_prefix:
        description: "Release label before the automatic build number (nightly, r1-a1, r1-b1, r1-1)"
        required: true
        default: nightly
        type: string
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: run-all-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  actions: read
  contents: write

jobs:
  validate-weekly-signing-keys:
    name: Validate weekly update release prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Require the release signing keypair for scheduled builds
        if: github.event_name == 'schedule'
        env:
          ARKUP_UPDATE_SIGNING_KEY_B64: ${{ secrets.ARKUP_UPDATE_SIGNING_KEY_B64 }}
          ARKUP_UPDATE_PUBLIC_KEY_B64: ${{ secrets.ARKUP_UPDATE_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ARKUP_UPDATE_SIGNING_KEY_B64" || -z "$ARKUP_UPDATE_PUBLIC_KEY_B64" ]]; then
            echo "Add repository secrets ARKUP_UPDATE_SIGNING_KEY_B64 and ARKUP_UPDATE_PUBLIC_KEY_B64 before scheduled releases." >&2
            exit 1
          fi
          KEY_DIR=$(mktemp -d)
          trap 'rm -rf -- "$KEY_DIR"' EXIT
          umask 077
          if ! printf '%s' "$ARKUP_UPDATE_SIGNING_KEY_B64" | base64 --decode > "$KEY_DIR/release.key" 2>/dev/null || \
             ! printf '%s' "$ARKUP_UPDATE_PUBLIC_KEY_B64" | base64 --decode > "$KEY_DIR/release.pub" 2>/dev/null || \
             [[ ! -s "$KEY_DIR/release.key" || ! -s "$KEY_DIR/release.pub" ]]; then
            echo "Weekly update signing secrets must be non-empty base64-encoded key files." >&2
            exit 1
          fi

      - name: Require a published Arkup-capable ISO as the update base
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE_RELEASE_TAG=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -s -r '
              add
              | [.[] | select(.draft == false and
                  any(.assets[]?; .name | endswith(".iso")))]
              | sort_by(.published_at)
              | last
              | .tag_name // empty')
          if [[ -z "$BASE_RELEASE_TAG" ]]; then
            echo "No published arkanaOS ISO release is available as the update base." >&2
            exit 1
          fi

          HAS_ARKUP_CLIENT=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$BASE_RELEASE_TAG" \
            --jq 'any(.assets[]?; .name == "arkanaOS-update-client.txt")')
          if [[ "$HAS_ARKUP_CLIENT" != true ]]; then
            echo "The latest ISO release $BASE_RELEASE_TAG predates the Arkup client. Run workflow_dispatch once to publish an Arkup-capable ISO before scheduled .aup releases." >&2
            exit 1
          fi

  stage1:
    uses: ./.github/workflows/01_stage1_base.yml
    needs: validate-weekly-signing-keys
    with:
      release_prefix: ${{ inputs.release_prefix || 'nightly' }}
    secrets: inherit

  stage2:
    needs: stage1
    uses: ./.github/workflows/02_stage2_toolchain.yml
    secrets: inherit

  stage3:
    needs: stage2
    uses: ./.github/workflows/03_stage3_graphics.yml
    secrets: inherit

  stage4:
    needs: stage3
    uses: ./.github/workflows/04_stage4_iso.yml
    secrets: inherit
