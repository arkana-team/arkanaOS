name: Run All Pipeline Stages

on:
  workflow_dispatch:
    inputs:
      release_prefix:
        description: "Release label before the automatic build number (nightly, r1-a1, r1-b1, r1-1); weekly releases run on Mondays"
        required: true
        default: nightly
        type: string
  schedule:
    # Publish a nightly ISO and signed update Sunday and Tuesday through Saturday.
    - cron: "0 3 * * 0,2-6"
    # Monday is the weekly developer release; it also includes the ISO and .aup.
    - cron: "0 3 * * 1"

concurrency:
  group: run-all-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  actions: read
  contents: write

jobs:
  validate-scheduled-update-prerequisites:
    name: Validate scheduled update release prerequisites
    runs-on: ubuntu-latest
    outputs:
      update_base_release_tag: ${{ steps.verify-update-base.outputs.release_tag }}
      update_base_run_id: ${{ steps.verify-update-base.outputs.run_id }}
      update_base_artifact_id: ${{ steps.verify-update-base.outputs.artifact_id }}
      update_base_artifact_name: ${{ steps.verify-update-base.outputs.artifact_name }}
      update_base_build_number: ${{ steps.verify-update-base.outputs.build_number }}
      update_base_source_sha: ${{ steps.verify-update-base.outputs.source_sha }}
    steps:
      - name: Reject manual weekly release labels
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_PREFIX: ${{ inputs.release_prefix }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_PREFIX" == weekly ]]; then
            echo "Weekly releases are published by the Monday schedule and cannot be manually labeled weekly." >&2
            exit 1
          fi

      - name: Check out source for scheduled release preflight
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require the release signing keypair for scheduled builds
        if: github.event_name == 'schedule'
        env:
          ARKUP_UPDATE_SIGNING_KEY_B64: ${{ secrets.ARKUP_UPDATE_SIGNING_KEY_B64 }}
          ARKUP_UPDATE_PUBLIC_KEY_B64: ${{ secrets.ARKUP_UPDATE_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ARKUP_UPDATE_SIGNING_KEY_B64" || -z "$ARKUP_UPDATE_PUBLIC_KEY_B64" ]]; then
            echo "Configure the Actions secrets ARKUP_UPDATE_SIGNING_KEY_B64 and ARKUP_UPDATE_PUBLIC_KEY_B64 before scheduled releases." >&2
            exit 1
          fi
          KEY_DIR=$(mktemp -d)
          trap 'rm -rf -- "$KEY_DIR"' EXIT
          umask 077
          if ! printf '%s' "$ARKUP_UPDATE_SIGNING_KEY_B64" | base64 --decode > "$KEY_DIR/release.key" 2>/dev/null || \
             ! printf '%s' "$ARKUP_UPDATE_PUBLIC_KEY_B64" | base64 --decode > "$KEY_DIR/release.pub" 2>/dev/null || \
             [[ ! -s "$KEY_DIR/release.key" || ! -s "$KEY_DIR/release.pub" ]]; then
            echo "Update signing secrets must be non-empty base64-encoded key files." >&2
            exit 1
          fi
          for key_file in "$KEY_DIR/release.key" "$KEY_DIR/release.pub"; do
            raw_key="$key_file.raw"
            if ! base64 --decode "$key_file" > "$raw_key" 2>/dev/null || \
               [[ "$(wc -c < "$raw_key")" -ne 32 ]]; then
              echo "arkup signing and public key files must each decode to 32 bytes." >&2
              exit 1
            fi
          done
          python3 scripts/verify-update-signing-keypair.py \
            "$KEY_DIR/release.key" "$KEY_DIR/release.pub"

      - name: Require a published system-update-compatible ISO as the update base
        id: verify-update-base
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_BASE_CHANNEL: ${{ github.event.schedule == '0 3 * * 1' && 'weekly' || 'nightly' }}
        run: |
          set -euo pipefail
          BASE_RELEASE_TAG=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -s 'add' |
            python3 scripts/select-weekly-update-base.py --channel "$UPDATE_BASE_CHANNEL")
          if [[ -z "$BASE_RELEASE_TAG" ]]; then
            echo "No published system-update-capable release with a supported arkanaOS tag is available as the update base. Publish a compatible ISO from Run All before scheduled .aup releases." >&2
            exit 1
          fi

          VERIFY_DIR=$(mktemp -d "$RUNNER_TEMP/arkana-update-base.XXXXXX")
          trap 'rm -rf -- "$VERIFY_DIR"' EXIT
          RELEASE_JSON="$VERIFY_DIR/release.json"
          MARKER_FILE="$VERIFY_DIR/system-update-marker.txt"
          RUN_JSON="$VERIFY_DIR/run.json"
          ARTIFACTS_JSON="$VERIFY_DIR/artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$BASE_RELEASE_TAG" > "$RELEASE_JSON"

          MARKER_ASSET=$(jq -cer '
            [.assets[]? | select(.name == "arkanaOS-update-client-system-update.txt")]
            | if length == 1 and .[0].size > 0 and .[0].size <= 512
              then .[0] else error("expected one small system-update marker asset") end
          ' "$RELEASE_JSON")
          MARKER_ASSET_ID=$(jq -er '.id | select(type == "number" and . > 0)' <<< "$MARKER_ASSET")
          MARKER_ASSET_SIZE=$(jq -er '.size | select(type == "number" and . > 0 and . <= 512)' <<< "$MARKER_ASSET")
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$MARKER_ASSET_ID" > "$MARKER_FILE"
          if [[ "$(wc -c < "$MARKER_FILE")" -ne "$MARKER_ASSET_SIZE" ]]; then
            echo "The selected release marker changed while it was being downloaded." >&2
            exit 1
          fi

          SOURCE_RUN_ID=$(awk -F= '$1 == "source-run-id" { print substr($0, index($0, "=") + 1) }' "$MARKER_FILE")
          if ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "The selected release marker has no valid source run ID." >&2
            exit 1
          fi
          WORKFLOW_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/00_run_all.yml" --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUN_JSON"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" |
            jq -s '{artifacts: [ .[] | .artifacts[]? ]}' > "$ARTIFACTS_JSON"
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$BASE_RELEASE_TAG" --jq .sha)

          python3 scripts/verify-weekly-base-provenance.py \
            --release-tag "$BASE_RELEASE_TAG" \
            --tag-sha "$TAG_SHA" \
            --marker "$MARKER_FILE" \
            --run-json "$RUN_JSON" \
            --artifacts-json "$ARTIFACTS_JSON" \
            --repository "$GITHUB_REPOSITORY" \
            --default-branch "$DEFAULT_BRANCH" \
            --workflow-id "$WORKFLOW_ID" > "$VERIFY_DIR/verified-base.json"

          for output_name in run_id artifact_id artifact_name build_number source_sha; do
            output_value=$(jq -er ".$output_name" "$VERIFY_DIR/verified-base.json")
            printf '%s=%s\n' "$output_name" "$output_value" >> "$GITHUB_OUTPUT"
          done
          printf 'release_tag=%s\n' "$BASE_RELEASE_TAG" >> "$GITHUB_OUTPUT"

  stage1:
    uses: ./.github/workflows/01_stage1_base.yml
    needs: validate-scheduled-update-prerequisites
    with:
      release_prefix: ${{ inputs.release_prefix || (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 1' && 'weekly' || 'nightly') }}
    secrets: inherit

  stage2:
    needs: stage1
    uses: ./.github/workflows/02_stage2_toolchain.yml
    secrets: inherit

  stage3:
    needs: stage2
    uses: ./.github/workflows/03_stage3_graphics.yml
    secrets: inherit

  stage4:
    needs: [stage3, validate-scheduled-update-prerequisites]
    uses: ./.github/workflows/04_stage4_iso.yml
    with:
      update_base_release_tag: ${{ needs.validate-scheduled-update-prerequisites.outputs.update_base_release_tag }}
      update_base_run_id: ${{ needs.validate-scheduled-update-prerequisites.outputs.update_base_run_id }}
      update_base_artifact_id: ${{ needs.validate-scheduled-update-prerequisites.outputs.update_base_artifact_id }}
      update_base_artifact_name: ${{ needs.validate-scheduled-update-prerequisites.outputs.update_base_artifact_name }}
      update_base_build_number: ${{ needs.validate-scheduled-update-prerequisites.outputs.update_base_build_number }}
      update_base_source_sha: ${{ needs.validate-scheduled-update-prerequisites.outputs.update_base_source_sha }}
    secrets: inherit
