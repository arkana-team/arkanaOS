name: 1. Build Base System

on:
  workflow_dispatch:
    inputs:
      release_prefix:
        description: "Release label before the automatic build number (nightly, r1-a1, r1-b1, r1-1)"
        required: true
        default: nightly
        type: string
  workflow_call:
    inputs:
      release_prefix:
        description: "Release label before the automatic build number"
        required: false
        default: nightly
        type: string

concurrency:
  group: arkana-build-number-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  base:
    name: 1. Build Base System
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Reserve build number
        id: reserve_build_number
        run: |
          case "$GITHUB_REF" in
            refs/heads/*) ;;
            *) echo "Build number reservation requires a branch ref." >&2; exit 1 ;;
          esac
          CURRENT=$(cat .buildnum)
          if ! [[ "$CURRENT" =~ ^[0-9]+$ ]]; then
            echo "Invalid .buildnum value: $CURRENT" >&2
            exit 1
          fi
          INCREMENT=1
          BUILD_NUM=$((CURRENT + INCREMENT))
          TEMP_FILE=$(mktemp .buildnum.XXXXXX)
          printf '%s\n' "$BUILD_NUM" > "$TEMP_FILE"
          chmod 644 "$TEMP_FILE"
          mv "$TEMP_FILE" .buildnum
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .buildnum
          git commit -m "Reserve build number $BUILD_NUM"
          git push origin "HEAD:$GITHUB_REF"
          echo "number=$BUILD_NUM" >> "$GITHUB_OUTPUT"

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache
          sudo docker image prune --all --force || true

      - name: Setup & Persist Ccache Across Runs
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-stage1
          restore-keys: ${{ runner.os }}-ccache-
          max-size: 10G

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: arkana-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Base Stage
        env:
          ARKANA_RELEASE_PREFIX: ${{ inputs.release_prefix }}
        run: |
          mkdir -p src staging output
          docker run --rm \
            -v "$(pwd)/src:/build/arkana/src" \
            -v "$(pwd)/staging:/build/arkana/staging" \
            -v "$(pwd)/output:/build/arkana/output" \
            -v "$HOME/.cache/ccache:/home/builder/.cache/ccache" \
            -e ARKANA_BUILD_NUMBER="${{ steps.reserve_build_number.outputs.number }}" \
            -e ARKANA_RELEASE_PREFIX="$ARKANA_RELEASE_PREFIX" \
            -e CCACHE_DIR=/home/builder/.cache/ccache \
            arkana-builder bash -c "sudo --preserve-env make -f arkanas/01_base.mk"

      - name: Archive Stage 1
        run: sudo tar -cf arkana-stage1.tar staging src && sudo chown $USER:$USER arkana-stage1.tar

      - name: Upload Stage 1 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkana-stage1
          path: arkana-stage1.tar
          retention-days: 7

      - name: Upload Error Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-error-logs
          path: |
            src/*/build/meson-logs/
            src/*/config.log
            src/*/build/CMakeOutput.log
            src/*/build/CMakeError.log
          retention-days: 7
