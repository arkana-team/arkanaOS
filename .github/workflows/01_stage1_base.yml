name: 1. Build Base System

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    name: 1. Build Base System
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache
          sudo docker image prune --all --force || true

      - name: Setup & Persist Ccache Across Runs
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-stage1
          restore-keys: ${{ runner.os }}-ccache-
          max-size: 10G

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: arkana-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Base Stage
        run: |
          mkdir -p src staging output
          docker run --rm \
            -v "$(pwd)/src:/build/arkana/src" \
            -v "$(pwd)/staging:/build/arkana/staging" \
            -v "$(pwd)/output:/build/arkana/output" \
            -v "$HOME/.cache/ccache:/home/builder/.cache/ccache" \
            -e CCACHE_DIR=/home/builder/.cache/ccache \
            arkana-builder bash -c "sudo make -f arkanas/01_base.mk"

      - name: Archive Stage 1
        run: sudo tar -cf arkana-stage1.tar staging src && sudo chown $USER:$USER arkana-stage1.tar

      - name: Upload Stage 1 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkana-stage1
          path: arkana-stage1.tar
          retention-days: 7

      - name: Upload Error Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-error-logs
          path: |
            src/*/build/meson-logs/
            src/*/config.log
            src/*/build/CMakeOutput.log
            src/*/build/CMakeError.log
          retention-days: 7
