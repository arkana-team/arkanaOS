name: 4. Assemble Bootable ISO

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  iso:
    name: 4. Assemble Bootable ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache
          sudo docker image prune --all --force || true

      - name: Setup & Persist Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-stage4
          restore-keys: ${{ runner.os }}-ccache-
          max-size: 10G

      - name: Download Stage 3 Artifact (From chained Run All)
        if: github.workflow == 'Run All Pipeline Stages'
        uses: actions/download-artifact@v4
        with:
          name: arkana-stage3

      - name: Download Stage 3 Artifact (Latest Across Repo)
        if: github.workflow != 'Run All Pipeline Stages'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching artifacts list..."
          if ! ARTIFACT_JSON=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100"); then
            echo "Error: Failed to fetch artifacts list from GitHub API. Please check token permissions."
            exit 1
          fi
          
          # Find latest matching artifact
          ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | jq -r '.artifacts | map(select((.name == "arkana-stage3" or .name == "arkana-graphics-staging") and .expired == false)) | sort_by(.created_at) | last | .id')
          
          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "Error: No valid stage 3 artifact found in the repository!"
            echo "API Response content:"
            echo "$ARTIFACT_JSON" | head -n 30
            exit 1
          fi
          
          echo "Found latest Stage 3 Artifact ID: $ARTIFACT_ID"
          echo "Downloading..."
          if ! gh api repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip > artifact.zip; then
            echo "Error: Failed to download artifact from GitHub API."
            exit 1
          fi
          
          echo "Unzipping..."
          unzip -q artifact.zip
          rm artifact.zip
          
          if [ -f arkana-graphics-staging.tar ]; then
            mv arkana-graphics-staging.tar arkana-stage3.tar
          fi
          
          if [ ! -f arkana-stage3.tar ]; then
            echo "Error: Extracted archive did not contain arkana-stage3.tar or arkana-graphics-staging.tar!"
            exit 1
          fi
          
          echo "Successfully prepared Stage 3 artifact!"

      - name: Unarchive Stage 3
        run: sudo tar -xf arkana-stage3.tar && rm arkana-stage3.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: arkana-builder:latest
          cache-from: type=gha

      - name: Build ISO Stage
        run: |
          mkdir -p output
          docker run --rm \
            -v "$(pwd)/src:/build/arkana/src" \
            -v "$(pwd)/staging:/build/arkana/staging" \
            -v "$(pwd)/output:/build/arkana/output" \
            -v "$HOME/.cache/ccache:/home/builder/.cache/ccache" \
            -e CCACHE_DIR=/home/builder/.cache/ccache \
            arkana-builder bash -c "sudo --preserve-env make -f arkanas/07_iso.mk"

      - name: Generate Release Notes & Tags from Template
        run: |
          BUILD_NUM=$(cat staging/etc/arkana-build-number)
          RELEASE_PREFIX=$(cat staging/etc/arkana-release-prefix)
          RELEASE_ID=$(cat staging/etc/arkana-release-id)
          RELEASE_PRERELEASE=$(cat staging/etc/arkana-release-prerelease)
          if ! [[ "$BUILD_NUM" =~ ^[0-9]+$ ]]; then
            echo "Invalid arkanaOS build number: $BUILD_NUM" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_PREFIX" =~ ^(nightly|r[1-9][0-9]*-(a[1-9][0-9]*|b[1-9][0-9]*|[1-9][0-9]*))$ ]]; then
            echo "Invalid arkanaOS release prefix: $RELEASE_PREFIX" >&2
            exit 1
          fi
          if [[ "$RELEASE_ID" != "${RELEASE_PREFIX}-${BUILD_NUM}" ]]; then
            echo "Release ID does not match the staged build number." >&2
            exit 1
          fi
          if [[ "$RELEASE_PREFIX" == nightly || "$RELEASE_PREFIX" =~ -[ab][1-9][0-9]*$ ]]; then
            EXPECTED_PRERELEASE=true
          else
            EXPECTED_PRERELEASE=false
          fi
          if [[ "$RELEASE_PRERELEASE" != "$EXPECTED_PRERELEASE" ]]; then
            echo "Release prerelease status does not match its prefix." >&2
            exit 1
          fi
          sed -i "s/RELEASE_ID/$RELEASE_ID/g" RELEASE_TEMPLATE.md
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "RELEASE_PRERELEASE=$RELEASE_PRERELEASE" >> "$GITHUB_ENV"

      - name: Upload Final arkanaOS ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkanaOS-${{ env.RELEASE_ID }}-iso
          path: output/arkana.iso
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ env.RELEASE_ID }}
          name: arkanaOS ${{ env.RELEASE_ID }}
          body_path: RELEASE_TEMPLATE.md
          files: output/arkana.iso
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
