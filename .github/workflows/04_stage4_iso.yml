name: 4. Assemble Bootable ISO

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Run All run ID on the default branch to rebuild"
        required: true
        type: string
  workflow_call:
    inputs:
      update_bases_json:
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  iso:
    name: 4. Assemble Bootable ISO
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: arkanaOS-release-${{ github.ref }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Verify Stage 3 Source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "ISO releases require a run on the default branch." >&2
            exit 1
          fi
          if [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/00_run_all.yml@$GITHUB_REF" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch && "$GITHUB_EVENT_NAME" != schedule ]]; then
              echo "Run All release builds support manual and scheduled events only." >&2
              exit 1
            fi
            # Run All orders stage4 after stage3; download only from this run.
            SOURCE_RUN_ID=$GITHUB_RUN_ID
            SOURCE_SHA=$GITHUB_SHA
          elif [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/04_stage4_iso.yml@$GITHUB_REF" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
              echo "Standalone ISO builds require a manual run." >&2
              exit 1
            fi
            if ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "Provide a successful Run All run ID." >&2
              exit 1
            fi
            # Standalone stage3 can consume unverified upstream artifacts. Only
            # Run All keeps all three producing stages within one trusted run.
            WORKFLOW_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/00_run_all.yml" --jq .id)
            RUN_JSON=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")
            SOURCE_SHA=$(jq -er --arg run_id "$SOURCE_RUN_ID" --arg workflow_id "$WORKFLOW_ID" \
              --arg repository "$GITHUB_REPOSITORY" --arg branch "$DEFAULT_BRANCH" '
              select((.id | tostring) == $run_id and
                (.workflow_id | tostring) == $workflow_id and
                .repository.full_name == $repository and
                .head_repository.full_name == $repository and
                .event == "workflow_dispatch" and .head_branch == $branch and
                .status == "completed" and .conclusion == "success") |
              .head_sha | select(test("^[0-9a-f]{40}$"))' <<< "$RUN_JSON")
          else
            echo "Unsupported ISO workflow caller." >&2
            exit 1
          fi
          {
            echo "run_id=$SOURCE_RUN_ID"
            echo "sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Seed build number from published releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RELEASE_TAGS="$RUNNER_TEMP/arkanaOS-release-tags.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name' > "$RELEASE_TAGS"
          python3 scripts/seed-build-number.py --build-file .buildnum < "$RELEASE_TAGS"

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache
          sudo docker image prune --all --force || true

      - name: Setup & Persist Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-stage4
          restore-keys: ${{ runner.os }}-ccache-
          max-size: 10G

      - name: Download Verified Stage 3 Artifact
        uses: actions/download-artifact@v4
        with:
          name: arkana-stage3
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/stage3-download

      - name: Unarchive Stage 3
        run: |
          set -euo pipefail
          EXTRACT_DIR=$(mktemp -d "$RUNNER_TEMP/stage3.XXXXXX")
          trap 'sudo rm -rf "$EXTRACT_DIR"' EXIT
          sudo tar -xf "$RUNNER_TEMP/stage3-download/arkana-stage3.tar" -C "$EXTRACT_DIR" -- staging src
          for member in staging src; do
            if [[ ! -d "$EXTRACT_DIR/$member" || -L "$EXTRACT_DIR/$member" || -e "$member" || -L "$member" ]]; then
              echo "Invalid or conflicting Stage 3 directory: $member" >&2
              exit 1
            fi
          done
          sudo mv "$EXTRACT_DIR/staging" "$EXTRACT_DIR/src" .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: arkana-builder:latest
          cache-from: type=gha

      - name: Build ISO Stage
        run: |
          mkdir -p output
          docker run --rm \
            -v "$(pwd)/src:/build/arkana/src" \
            -v "$(pwd)/staging:/build/arkana/staging" \
            -v "$(pwd)/output:/build/arkana/output" \
            -v "$HOME/.cache/ccache:/home/builder/.cache/ccache" \
            -e CCACHE_DIR=/home/builder/.cache/ccache \
            arkana-builder bash -c "sudo --preserve-env make -f arkanas/07_iso.mk"

      - name: Mark ISO as arkup system-update-capable
        id: mark-update-capability
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ ! -x output/iso-root/usr/bin/arkup ]]; then
            echo "The ISO root does not contain the arkup update client." >&2
            exit 1
          fi
          if ! sudo chroot --groups="$(id -G)" \
            --userspec="$(id -u):$(id -g)" output/iso-root \
            /usr/bin/arkup pack --help 2>&1 | \
            tee "$RUNNER_TEMP/arkup-pack-help.txt" >/dev/null || \
            ! grep -Fq -- '--base-sequence' "$RUNNER_TEMP/arkup-pack-help.txt" || \
            ! grep -Fq -- '--system-update' "$RUNNER_TEMP/arkup-pack-help.txt"; then
            echo "The ISO root arkup client cannot validate base-bound system updates." >&2
            exit 1
          fi
          printf 'arkup-client=/usr/bin/arkup\n' > output/arkanaOS-update-client.txt
          chmod 0644 output/arkanaOS-update-client.txt
          if [[ "$SOURCE_RUN_ID" == "$GITHUB_RUN_ID" && \
                "$SOURCE_SHA" == "$GITHUB_SHA" && \
                "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" && \
                "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/00_run_all.yml@$GITHUB_REF" ]]; then
            if ! [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && \
                  "$(cat staging/etc/arkana-build-number)" =~ ^[0-9]+$ ]]; then
              echo "The source run or build metadata is malformed; refusing to mark this ISO as an update base." >&2
              exit 1
            fi
            printf 'arkup-client=/usr/bin/arkup\nbase-sequence=1\nsystem-update=1\nsource-run-id=%s\nsource-sha=%s\nbuild-number=%s\n' \
              "$SOURCE_RUN_ID" "$SOURCE_SHA" "$(cat staging/etc/arkana-build-number)" \
              > output/arkanaOS-update-client-system-update.txt
            chmod 0644 output/arkanaOS-update-client-system-update.txt
            echo 'system_update_capable=true' >> "$GITHUB_OUTPUT"
          else
            rm -f -- output/arkanaOS-update-client-system-update.txt
            echo 'system_update_capable=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Release Notes & Tags from Template
        env:
          UPDATE_BASES_JSON: ${{ inputs.update_bases_json }}
        run: |
          BUILD_NUM=$(cat staging/etc/arkana-build-number)
          RELEASE_PREFIX=$(cat staging/etc/arkana-release-prefix)
          RELEASE_ID=$(cat staging/etc/arkana-release-id)
          RELEASE_VERSION=$(cat staging/etc/arkana-release-version)
          RELEASE_PRERELEASE=$(cat staging/etc/arkana-release-prerelease)
          if [[ "$RELEASE_PREFIX" == weekly && "$GITHUB_EVENT_NAME" != schedule ]]; then
            echo "Weekly release labels are reserved for the Monday schedule." >&2
            exit 1
          fi
          if ! [[ "$BUILD_NUM" =~ ^[0-9]+$ ]]; then
            echo "Invalid arkanaOS build number: $BUILD_NUM" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_PREFIX" =~ ^(nightly|weekly|r[1-9][0-9]*-(a[1-9][0-9]*|b[1-9][0-9]*|[1-9][0-9]*))$ ]]; then
            echo "Invalid arkanaOS release prefix: $RELEASE_PREFIX" >&2
            exit 1
          fi
          if [[ "$RELEASE_PREFIX" == nightly || "$RELEASE_PREFIX" == weekly ]]; then
            EXPECTED_RELEASE_ID="${RELEASE_PREFIX}-${BUILD_NUM}"
            EXPECTED_RELEASE_VERSION="$RELEASE_PREFIX"
            if [[ "$RELEASE_PREFIX" == weekly ]]; then
              RELEASE_CHANNEL=Weekly
              RELEASE_STATUS="Weekly developer build for testing and development only. Supported for 7 days."
            else
              RELEASE_CHANNEL=Nightly
              RELEASE_STATUS="Developer build for testing and development only. Supported for 7 days."
            fi
          elif [[ "$RELEASE_PREFIX" =~ ^r([1-9][0-9]*)-a([1-9][0-9]*)$ ]]; then
            EXPECTED_RELEASE_ID="v${BASH_REMATCH[1]}.0-alpha${BASH_REMATCH[2]}-build-${BUILD_NUM}"
            EXPECTED_RELEASE_VERSION="${BASH_REMATCH[1]}.0 (alpha ${BASH_REMATCH[2]})"
            RELEASE_CHANNEL=Alpha
            RELEASE_STATUS="Early pre-release for testing and development. Supported for 2 weeks."
          elif [[ "$RELEASE_PREFIX" =~ ^r([1-9][0-9]*)-b([1-9][0-9]*)$ ]]; then
            EXPECTED_RELEASE_ID="v${BASH_REMATCH[1]}.0-beta${BASH_REMATCH[2]}-build-${BUILD_NUM}"
            EXPECTED_RELEASE_VERSION="${BASH_REMATCH[1]}.0 (beta ${BASH_REMATCH[2]})"
            RELEASE_CHANNEL=Beta
            RELEASE_STATUS="Pre-release for broader testing. Supported for 7 weeks."
          elif [[ "$RELEASE_PREFIX" =~ ^r([1-9][0-9]*)-([1-9][0-9]*)$ ]]; then
            EXPECTED_RELEASE_ID="v${BASH_REMATCH[1]}.0-build-${BUILD_NUM}"
            EXPECTED_RELEASE_VERSION="${BASH_REMATCH[1]}.0"
            RELEASE_CHANNEL=Stable
            RELEASE_STATUS="Stable release. Supported for 10 months."
          else
            echo "Invalid arkanaOS release prefix: $RELEASE_PREFIX" >&2
            exit 1
          fi
          if [[ "$RELEASE_ID" != "$EXPECTED_RELEASE_ID" || "$RELEASE_VERSION" != "$EXPECTED_RELEASE_VERSION" ]]; then
            echo "Release metadata does not match its validated prefix and build number." >&2
            exit 1
          fi
          if [[ "$RELEASE_PREFIX" == nightly || "$RELEASE_PREFIX" == weekly || "$RELEASE_PREFIX" =~ -[ab][1-9][0-9]*$ ]]; then
            EXPECTED_PRERELEASE=true
          else
            EXPECTED_PRERELEASE=false
          fi
          if [[ "$RELEASE_PRERELEASE" != "$EXPECTED_PRERELEASE" ]]; then
            echo "Release prerelease status does not match its prefix." >&2
            exit 1
          fi
          RELEASE_NAME="arkanaOS ${RELEASE_VERSION} build ${BUILD_NUM}"
          UPDATE_BASE_COUNT=$(jq -er 'if type == "array" then length else error("update bases must be a JSON array") end' <<< "${UPDATE_BASES_JSON:-[]}")
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$UPDATE_BASE_COUNT" -eq 0 ]]; then
            RELEASE_UPDATE_ASSETS="This is the initial scheduled ISO bootstrap. It includes the verification public key and seeds the signed .aup update path; update packages begin with the next scheduled release."
            RELEASE_UPDATE_GUIDANCE=$'No .aup package is attached because there is no earlier update-capable release to target. After the next scheduled release includes its update package, trust the verification key once on the installed system:\n\n```sh\nsudo arkup trust ./arkanaOS-update-signing.pub\n```'
          elif [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            RELEASE_UPDATE_ASSETS="This scheduled release includes the bootable ISO and signed arkup .aup update package or packages, checksums, and the verification public key."
            RELEASE_UPDATE_GUIDANCE=$'Each update package filename includes from-build-N; use the package whose base build matches the build installed on your system. After applying it, choose the next package using your new build number. Nightly packages are based on the latest scheduled release. The Monday weekly release includes a package from the previous weekly build and, when those builds differ, a second package from Sunday\'s nightly build. This keeps both update paths available to weekly and nightly installations. Update-base ISOs are downloaded from persistent GitHub Release assets and checked against GitHub\'s SHA-256 digest and the source workflow provenance.\n\nBefore applying an update, download the verification key from the official arkanaOS release and trust it once on the installed system:\n\n```sh\nsudo arkup trust ./arkanaOS-update-signing.pub\nsudo arkup apply ./path/to/update.aup\n```'
          else
            RELEASE_UPDATE_ASSETS="This manually triggered release includes the bootable ISO only."
            RELEASE_UPDATE_GUIDANCE="No signed .aup update package is attached to a manually triggered release."
          fi
          export RELEASE_NAME RELEASE_CHANNEL RELEASE_STATUS
          export RELEASE_UPDATE_ASSETS RELEASE_UPDATE_GUIDANCE
          python3 - <<'PY'
          import os
          from pathlib import Path

          template_path = Path("RELEASE_TEMPLATE.md")
          template = template_path.read_text(encoding="utf-8")
          replacements = {
              "@@RELEASE_CHANNEL@@": os.environ["RELEASE_CHANNEL"],
              "@@RELEASE_NAME@@": os.environ["RELEASE_NAME"],
              "@@RELEASE_STATUS@@": os.environ["RELEASE_STATUS"],
              "@@RELEASE_UPDATE_ASSETS@@": os.environ["RELEASE_UPDATE_ASSETS"],
              "@@RELEASE_UPDATE_GUIDANCE@@": os.environ["RELEASE_UPDATE_GUIDANCE"],
          }
          missing = [token for token in replacements if token not in template]
          if missing:
              raise SystemExit(f"Release template is missing placeholders: {missing}")
          for token, value in replacements.items():
              template = template.replace(token, value)
          template_path.write_text(template, encoding="utf-8")
          PY
          {
            echo "RELEASE_ID=$RELEASE_ID"
            echo "RELEASE_NAME=$RELEASE_NAME"
            echo "RELEASE_ARTIFACT_NAME=arkanaOS-${RELEASE_ID#v}-iso"
            echo "RELEASE_PRERELEASE=$RELEASE_PRERELEASE"
          } >> "$GITHUB_ENV"

      - name: Build signed update packages for scheduled developer release
        id: build-updates
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ARKUP_UPDATE_SIGNING_KEY_B64: ${{ secrets.ARKUP_UPDATE_SIGNING_KEY_B64 }}
          ARKUP_UPDATE_PUBLIC_KEY_B64: ${{ secrets.ARKUP_UPDATE_PUBLIC_KEY_B64 }}
          UPDATE_BASES_JSON: ${{ inputs.update_bases_json }}
        run: |
          set -euo pipefail
          if [[ -z "$ARKUP_UPDATE_SIGNING_KEY_B64" || -z "$ARKUP_UPDATE_PUBLIC_KEY_B64" ]]; then
            echo "Scheduled update signing secrets are required; refusing to publish an unsigned or incomplete release." >&2
            exit 1
          fi
          if ! jq -e 'type == "array" and length <= 2' \
            <<< "$UPDATE_BASES_JSON" >/dev/null; then
            echo "Scheduled update bases are missing or invalid." >&2
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools
          UPDATE_TEMP=$(mktemp -d "$RUNNER_TEMP/arkana-update-packages.XXXXXX")
          KEY_DIR="$RUNNER_TEMP/arkana-update-key"
          mkdir -m 700 "$KEY_DIR"
          trap 'rm -rf -- "$UPDATE_TEMP" "$KEY_DIR"' EXIT
          umask 077
          printf '%s' "$ARKUP_UPDATE_SIGNING_KEY_B64" | base64 --decode > "$KEY_DIR/release.key"
          printf '%s' "$ARKUP_UPDATE_PUBLIC_KEY_B64" | base64 --decode > "$KEY_DIR/release.pub"
          unset ARKUP_UPDATE_SIGNING_KEY_B64 ARKUP_UPDATE_PUBLIC_KEY_B64
          test -s "$KEY_DIR/release.key" && test -s "$KEY_DIR/release.pub"

          # The build containers create root-owned trees. The bounded packer runs
          # as the runner account and records modes, not filesystem ownership.
          sudo chown -R "$(id -u):$(id -g)" output/iso-root
          BASE_COUNT=$(jq -er 'length' <<< "$UPDATE_BASES_JSON")
          WORKFLOW_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/00_run_all.yml" --jq .id)
          for ((base_index = 0; base_index < BASE_COUNT; base_index++)); do
            BASE_JSON=$(jq -ce ".[${base_index}]" <<< "$UPDATE_BASES_JSON")
            UPDATE_BASE_RELEASE_TAG=$(jq -er '.release_tag' <<< "$BASE_JSON")
            UPDATE_BASE_RUN_ID=$(jq -er '.run_id' <<< "$BASE_JSON")
            UPDATE_BASE_ISO_ASSET_ID=$(jq -er '.iso_asset_id' <<< "$BASE_JSON")
            UPDATE_BASE_ISO_SIZE=$(jq -er '.iso_asset_size' <<< "$BASE_JSON")
            UPDATE_BASE_ISO_DIGEST=$(jq -er '.iso_digest' <<< "$BASE_JSON")
            UPDATE_BASE_MARKER_ID=$(jq -er '.marker_asset_id' <<< "$BASE_JSON")
            UPDATE_BASE_MARKER_SIZE=$(jq -er '.marker_asset_size' <<< "$BASE_JSON")
            UPDATE_BASE_MARKER_DIGEST=$(jq -er '.marker_digest' <<< "$BASE_JSON")
            UPDATE_BASE_BUILD_NUMBER=$(jq -er '.build_number' <<< "$BASE_JSON")
            UPDATE_BASE_SOURCE_SHA=$(jq -er '.source_sha' <<< "$BASE_JSON")
            if ! [[ "$UPDATE_BASE_RELEASE_TAG" =~ ^(nightly-[0-9]+|weekly-[0-9]+|v[1-9][0-9]*\.0-((alpha[1-9][0-9]*|beta[1-9][0-9]*)-build|build)-[0-9]+)$ && \
                  "$UPDATE_BASE_RUN_ID" =~ ^[1-9][0-9]*$ && \
                  "$UPDATE_BASE_ISO_ASSET_ID" =~ ^[1-9][0-9]*$ && \
                  "$UPDATE_BASE_ISO_SIZE" =~ ^[1-9][0-9]*$ && \
                  "$UPDATE_BASE_ISO_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && \
                  "$UPDATE_BASE_MARKER_ID" =~ ^[1-9][0-9]*$ && \
                  "$UPDATE_BASE_MARKER_SIZE" =~ ^[1-9][0-9]*$ && \
                  "$UPDATE_BASE_MARKER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && \
                  "$UPDATE_BASE_BUILD_NUMBER" =~ ^[0-9]+$ && \
                  "$UPDATE_BASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Update base provenance inputs are malformed." >&2
              exit 1
            fi

            BASE_RELEASE_JSON="$UPDATE_TEMP/base-$base_index-release.json"
            BASE_RUN_JSON="$UPDATE_TEMP/base-$base_index-run.json"
            BASE_MARKER="$UPDATE_TEMP/base-$base_index-marker.txt"
            BASE_ISO="$UPDATE_TEMP/base-$base_index.iso"
            BASE_ROOT="$UPDATE_TEMP/base-$base_index-root"
            BASE_SQUASHFS="$UPDATE_TEMP/base-$base_index-rootfs.sfs"
            VERIFIED_BASE_JSON="$UPDATE_TEMP/base-$base_index-verified.json"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$UPDATE_BASE_RELEASE_TAG" > "$BASE_RELEASE_JSON"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPDATE_BASE_RUN_ID" > "$BASE_RUN_JSON"
            TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$UPDATE_BASE_RELEASE_TAG" --jq .sha)
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$UPDATE_BASE_MARKER_ID" > "$BASE_MARKER"
            if [[ "$(wc -c < "$BASE_MARKER")" -ne "$UPDATE_BASE_MARKER_SIZE" ]] || \
               [[ "sha256:$(sha256sum "$BASE_MARKER" | cut -d' ' -f1)" != "$UPDATE_BASE_MARKER_DIGEST" ]]; then
              echo "The update base provenance marker changed after preflight." >&2
              exit 1
            fi
            python3 scripts/verify-weekly-base-provenance.py \
              --release-tag "$UPDATE_BASE_RELEASE_TAG" \
              --tag-sha "$TAG_SHA" \
              --marker "$BASE_MARKER" \
              --run-json "$BASE_RUN_JSON" \
              --release-json "$BASE_RELEASE_JSON" \
              --repository "$GITHUB_REPOSITORY" \
              --default-branch "$DEFAULT_BRANCH" \
              --workflow-id "$WORKFLOW_ID" > "$VERIFIED_BASE_JSON"
            jq -e --argjson expected "$BASE_JSON" --argjson actual "$(cat "$VERIFIED_BASE_JSON")" \
              '$expected == $actual' >/dev/null || {
                echo "The update base release metadata changed after preflight." >&2
                exit 1
              }
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$UPDATE_BASE_ISO_ASSET_ID" > "$BASE_ISO"
            if [[ ! -f "$BASE_ISO" || -L "$BASE_ISO" || \
                  "$(wc -c < "$BASE_ISO")" -ne "$UPDATE_BASE_ISO_SIZE" ]] || \
               ! printf '%s  %s\n' "${UPDATE_BASE_ISO_DIGEST#sha256:}" "$BASE_ISO" | sha256sum --check --status; then
              echo "The persistent update-base ISO failed its release size or SHA-256 check." >&2
              exit 1
            fi

            xorriso -osirrox on -indev "$BASE_ISO" \
              -extract /boot/rootfs.sfs "$BASE_SQUASHFS"
            unsquashfs -no-progress -processors 1 -d "$BASE_ROOT" "$BASE_SQUASHFS"
            if [[ -L "$BASE_ROOT/etc" || -L "$BASE_ROOT/etc/arkana-build-number" || \
                  ! -f "$BASE_ROOT/etc/arkana-build-number" || \
                  "$(cat "$BASE_ROOT/etc/arkana-build-number")" != "$UPDATE_BASE_BUILD_NUMBER" ]]; then
              echo "The update base ISO build number does not match its verified release metadata." >&2
              exit 1
            fi
            if [[ -L "$BASE_ROOT/usr" || -L "$BASE_ROOT/usr/bin" || \
                  -L "$BASE_ROOT/usr/bin/arkup" || ! -f "$BASE_ROOT/usr/bin/arkup" || \
                  ! -x "$BASE_ROOT/usr/bin/arkup" ]]; then
              echo "The selected base ISO does not include the arkup update client; refusing to publish an unusable .aup package." >&2
              exit 1
            fi
            if [[ ! -f output/iso-root/etc/arkana-build-number ]]; then
              echo "The new ISO is missing arkanaOS release metadata." >&2
              exit 1
            fi

            ./build-update.sh \
              --base-root "$BASE_ROOT" \
              --target-root "$PWD/output/iso-root" \
              --signing-key "$KEY_DIR/release.key" \
              --public-key "$KEY_DIR/release.pub" \
              --output-dir "$PWD/output/updates" \
              --description "Scheduled arkanaOS developer update from build $UPDATE_BASE_BUILD_NUMBER"

            UPDATE_PACKAGE="output/updates/arkanaos-${RELEASE_ID}-from-build-${UPDATE_BASE_BUILD_NUMBER}.aup"
            if [[ ! -f "$UPDATE_PACKAGE" || ! -s "$UPDATE_PACKAGE" || -L "$UPDATE_PACKAGE" ]]; then
              echo "The scheduled update builder did not produce the expected base-specific .aup package." >&2
              exit 1
            fi
            (cd output/updates && sha256sum --check "$(basename "$UPDATE_PACKAGE").sha256")
            echo "Scheduled update package built from $UPDATE_BASE_RELEASE_TAG: $UPDATE_PACKAGE"
            rm -rf -- "$BASE_ROOT" "$BASE_SQUASHFS" "$BASE_ISO" "$BASE_RELEASE_JSON" "$BASE_RUN_JSON" "$BASE_MARKER" "$VERIFIED_BASE_JSON"
          done
          mkdir -p output/updates
          cp "$KEY_DIR/release.pub" output/updates/arkanaOS-update-signing.pub
          chmod 0644 output/updates/arkanaOS-update-signing.pub
          echo "update_count=$BASE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload Verified arkanaOS ISO Base Artifact
        if: steps.mark-update-capability.outputs.system_update_capable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: |
            output/arkana.iso
            output/arkanaOS-update-client-system-update.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload arkanaOS ISO Artifact
        if: steps.mark-update-capability.outputs.system_update_capable != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: output/arkana.iso
          if-no-files-found: error
          retention-days: 14

      - name: Upload Signed arkanaOS Update Artifact
        if: github.event_name == 'schedule' && steps.build-updates.outputs.update_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}-update
          path: |
            output/updates/*.aup
            output/updates/*.aup.sha256
            output/updates/arkanaOS-update-signing.pub
          if-no-files-found: error
          retention-days: 14

      - name: Select release assets
        id: release-assets
        env:
          SCHEDULED_UPDATE_RELEASE: ${{ github.event_name == 'schedule' }}
          UPDATE_COUNT: ${{ steps.build-updates.outputs.update_count || '0' }}
        run: |
          set -euo pipefail
          {
            echo "files<<EOF"
            echo "output/arkana.iso"
            echo "output/arkanaOS-update-client.txt"
            if [[ -f output/arkanaOS-update-client-system-update.txt ]]; then
              echo "output/arkanaOS-update-client-system-update.txt"
            fi
            if [[ "$SCHEDULED_UPDATE_RELEASE" == true ]]; then
              if [[ -f output/updates/arkanaOS-update-signing.pub ]]; then
                echo "output/updates/arkanaOS-update-signing.pub"
              fi
              if [[ "$UPDATE_COUNT" -gt 0 ]]; then
                find output/updates -maxdepth 1 -type f \
                  \( -name '*.aup' -o -name '*.aup.sha256' \) \
                  -print | sort
              fi
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: ${{ env.RELEASE_ID }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ steps.source.outputs.sha }}
          body_path: RELEASE_TEMPLATE.md
          files: ${{ steps.release-assets.outputs.files }}
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
