name: Test suite

on:
  push:
    paths:
      - "Makefile"
      - "Dockerfile"
      - "build.sh"
      - "build"
      - "arkanas/**/*.mk"
      - "scripts/**"
      - "tests/**"
      - "genfstab"
      - "arkana-install"
      - "bootinit"
      - "liveinit"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "Makefile"
      - "Dockerfile"
      - "build.sh"
      - "build"
      - "arkanas/**/*.mk"
      - "scripts/**"
      - "tests/**"
      - "genfstab"
      - "arkana-install"
      - "bootinit"
      - "liveinit"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run the Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out arkanaOS
        uses: actions/checkout@v4

      - name: Run the full test suite
        run: python3 -m unittest discover -s tests
